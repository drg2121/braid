<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img"
     aria-label="Braid">
  <!-- Two libraries overlapping, and what they share drawn solid: the union is
       the whole point of the tool. Two shapes and one filled intersection are
       all it is, which is why it still reads at eighteen pixels. -->
  <defs>
    <clipPath id="braid-overlap">
      <rect x="18" y="18" width="46" height="46" rx="14"/>
    </clipPath>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="9">
    <rect x="18" y="18" width="46" height="46" rx="14"/>
    <rect x="36" y="36" width="46" height="46" rx="14"/>
  </g>
  <g clip-path="url(#braid-overlap)">
    <rect x="36" y="36" width="46" height="46" rx="14" fill="currentColor"/>
  </g>
</svg>
