[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jwsync"
version = "0.1.0"
description = "Merge and synchronise JW Library backups across phone, tablet and laptop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["jw-library", "backup", "merge", "sync", "sqlite"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jwsync = "jwsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# webui.py embeds an HTML page; rewrapping its CSS and markup hurts readability.
"src/jwsync/webui.py" = ["E501"]
